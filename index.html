    function useDbCollection(colName, initialData, authUser) {
      const [data, setData] = useState([]);

      useEffect(() => {
        if (!db || !authUser) return;
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
        const unsub = onSnapshot(colRef, (snap) => {
          if (snap.empty) {
            setData([]); 
          } else {
            const items = [];
            snap.forEach(d => items.push(d.data()));
            items.sort((a,b) => {
              const idA = a.id || 0;
              const idB = b.id || 0;
              if (typeof idA === 'number' && typeof idB === 'number') return idB - idA;
              return 0;
            }); 
            setData(items);
          }
        }, (err) => {
          console.error(`Gagal memuat Data Realtime untuk ${colName}:`, err);
        });
        return () => unsub();
      }, [colName, authUser]);

      const add = async (item) => {
        if (!db || !authUser) return;
        const docId = String(item.id || item.name || Date.now());
        const cleaned = cleanUndefined(item);
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', colName, docId), cleaned);
      };

      const update = async (id, item) => {
        if (!db || !authUser) return;
        const cleaned = cleanUndefined(item);
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', colName, String(id)), cleaned);
      };

      const remove = async (id) => {
        if (!db || !authUser) return;
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', colName, String(id)));
      };

      return [data, add, update, remove];
    }

    const COMPOSITE_TESTS = {
      bleepTest: {
        fields: [
          { key: 'bleepLevel', label: 'Level', placeholder: 'Contoh: 5' },
          { key: 'bleepShuttle', label: 'Balikan (Shuttle)', placeholder: 'Contoh: 3' }
        ],
        calculate: (vals, age) => {
          const level = Number(vals.bleepLevel || 0);
          const shuttle = Number(vals.bleepShuttle || 0);
          if (level <= 0) return null;
          // Estimasi kecepatan berdasarkan level dan shuttle (Leger 1982)
          // Speed per level: 8.5 km/h at level 1, +0.5 km/h per level
          // Setiap level memiliki jumlah shuttle bervariasi, diambil rata-rata ~8.5 shuttle/level
          const shuttlesPerLevel = [0, 7, 8, 8, 9, 9, 10, 10, 11, 11, 11, 12, 12, 13, 13, 13, 14, 14, 15, 15, 16];
          const maxShuttle = shuttlesPerLevel[Math.min(level, shuttlesPerLevel.length - 1)] || 8;
          const speed = 8.0 + 0.5 * level + (shuttle > 0 ? (shuttle / maxShuttle) * 0.5 : 0);
          // Formula VO2Max (Leger & Lambert 1982, disederhanakan)
          const a = Number(age) || 20;
          const vo2max = 31.025 + 3.238 * speed - 3.248 * a + 0.1536 * a * speed;
          return Math.round(vo2max * 10) / 10;
        },
        summaryLabel: (vals) => {
          const l = vals.bleepLevel || '-';
          const s = vals.bleepShuttle || '-';
          return `Level ${l}, Shuttle ${s}`;

        calculate: (vals) => {
          const standing = Number(vals.vjReachStanding || 0);
          const max = Number(vals.vjReachMax || 0);
          if (standing <= 0 || max <= 0) return null;
          if (max < standing) return null;
          return max - standing;
        },
        summaryLabel: (vals) => {
          const r = vals.vjReachStanding || '-';
          const l = vals.vjReachMax || '-';
          return `Berdiri: ${r} cm, Lompat: ${l} cm`;

              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Firebase Auth Error:", err);
            setAuthError(err.message);
          }
        };
        initAuth();

        const unsub = onAuthStateChanged(auth, async (user) => {
          if (user) {
             try {
                 const sysRef = doc(db, 'artifacts', appId, 'public', 'data', 'system_config', 'seeded');
                 const sysDoc = await getDoc(sysRef);
                 if (!sysDoc.exists()) {
                    const seedData = async (colName, dataArr) => {

                       for (let item of dataArr) {
                          const cleaned = cleanUndefined(item);

                    await seedData('users', initialUsers);

                    await seedData('articles', initialArticles);

                    await seedData('pointSettings', initialPointSettings);
                    await seedData('historicalRaports', initialHistoricalRaports);

                    await seedData('sppBills', initialSppBills);
                    await seedData('sppPayments', initialSppPayments);
                    await seedData('sanctions', initialSanctions);
                    await seedData('physicalTests', []);
                    await seedData('physicalNorms', []);
                    await seedData('customTestTypes', []);
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'featureSettings', 'global'), initialFeatureSettings);
                    
                    await setDoc(sysRef, { isSeeded: true });
                 }
             } catch(err) {
                 console.error("Firestore Initialization Error:", err);
                 setAuthError("Gagal membaca Firestore Database. Pastikan Rules Firestore Anda mengizinkan read/write.");
             }

          setAuthUser(user);

match /artifacts/simtkdmura/public/data/&#123;document=**&#125; &#123;

&#125;</pre>
