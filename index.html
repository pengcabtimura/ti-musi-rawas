      const canIssueSanction = user.role === 'super_admin' || user.role === 'pengurus_club';
      
      const availableTargets = users.filter(u => {
        if (u.id === user.id) return false;
        if (user.role === 'super_admin') {
          return u.role === 'atlet' || u.role === 'pelatih' || u.role === 'pengurus_club';
        }
        if (user.role === 'pengurus_club') {
          return (u.role === 'atlet' || u.role === 'pelatih') && u.club === user.club;
        }
        return false;
      });

      const visibleSanctions = sanctions.filter(s => 
        user.role === 'super_admin' || 
        s.userId === user.id || 
        s.issuerId === user.id || 
        users.find(u => u.id === s.userId)?.club === user.club
      ).slice().reverse();

      const handleIssueSanction = (e) => { 
        e.preventDefault(); 
        if (!targetUserId || !reason.trim()) { triggerToast("Lengkapi form sanksi!", "error"); return; } 
        if (sanctionLevel === 'Berat' && !suspendUntil) { triggerToast("Tentukan batas tanggal blokir!", "error"); return; }
        
        const targetUser = users.find(u => u.id === Number(targetUserId));
        
        addSanction({ 
          id: Date.now(), 
          userId: Number(targetUserId), 
          issuerId: user.id, 
          issuerName: user.name, 
          reason, 
          level: sanctionLevel,
          date: new Date().toISOString().split('T')[0], 
          status: 'Aktif' 
        });

        if (sanctionLevel === 'Berat') {
          updateUser(targetUserId, { ...targetUser, status: 'Nonaktif', suspendedUntil: suspendUntil });
          triggerToast(`Akun di-Blokir (DB Updated) hingga ${suspendUntil}!`);
        } else {
          triggerToast(`Peringatan ${sanctionLevel} masuk DB!`);
        }
        
        setTargetUserId(''); setReason(''); setSanctionLevel('Ringan'); setSuspendUntil(''); setShowAdd(false); 
      };

      const handleStartEditSanction = (s) => { setEditingSanctionId(s.id); setEditSanctionData(s); };
      const handleSaveEditSanction = (e) => {
          e.preventDefault();
          updateSanction(editingSanctionId, editSanctionData);
          setEditingSanctionId(null); triggerToast("Data sanksi diperbarui.");

      const handleDeleteSanction = (id) => {
          if(window.confirm("Hapus catatan pelanggaran ini?")) { deleteSanction(id); triggerToast("Catatan dihapus dari DB."); }

        <div className="space-y-4 animate-fade-in">

              <Icon name="AlertTriangle" className="w-4 h-4 text-white" /> <span>{showAdd ? 'Batal' : 'Berikan Peringatan / Sanksi'}</span>

          {showAdd && (
            <form onSubmit={handleIssueSanction} className="bg-red-50 p-4 rounded-3xl border border-red-200 space-y-3">

              {sanctionLevel === 'Berat' && (
                <div className="animate-fade-in">
                  <label className="block text-[10px] font-bold text-red-900 uppercase mb-1">Nonaktifkan Akun Sampai Tanggal:</label>

                        <textarea rows="2" value={editSanctionData.reason} onChange={e => setEditSanctionData({...editSanctionData, reason: e.target.value})} className="w-full text-xs p-2 border rounded-xl" required />

                      </div>
                    </>
                  )}
                </div>
              ); 
            })}
          </div>
        </div>
      );
    }

    function UKTView({ user, events, addUktEvent, updateUktEvent, deleteUktEvent, registrations, addUktReg, updateUktReg, users, updateUser, points, addPoint, historicalRaports, addRaport, updateRaport, deleteRaport, triggerToast, poinRules }) {

      // =====================================================================

        const evRegs = registrations.filter(reg => reg.uktEventId === ev.id);

          .map(r => {
            const athlete = users.find(u => u.id === r.athleteId);

            if (r.period !== ev.period) return null;

        doc.save(`Peringkat_UKT_${ev.period.replace(/\s+/g, '_')}_${(ev.executionDate || 'no_date').replace(/\s+/g, '_')}.pdf`);

              if (line[i] === '"') { inQuotes = !inQuotes; }
              else if (line[i] === ',' && !inQuotes) { values.push(currentVal); currentVal = ''; }
              else { currentVal += line[i]; }
            }
            values.push(currentVal);
            values = values.map(v => v.trim().replace(/"/g, ''));

                  paymentStatus: statusBayar,
                  raport: null,
                  passStatus: null

                successCount++;

                    </div>

                      <span className="text-[9px] font-semibold text-red-500/80 block mt-0.5">{ev.title}</span>

                        {reg.status === 'confirmed' && reg.paymentStatus === 'pending' && (

    function RaportView({ user, users, historicalRaports, triggerToast, addRaport, updateRaport, deleteRaport }) {
      const [selectedAthleteId, setSelectedAthleteId] = useState(user.role === 'atlet' ? user.id : ''); const [activePeriodTab, setActivePeriodTab] = useState('Periode I');
      const [editingRaportId, setEditingRaportId] = useState(null);
      const [editRaportData, setEditRaportData] = useState(null);
      const athletes = users.filter(u => u.role === 'atlet' && (user.role === 'super_admin' || u.club === user.club)); const activeAthlete = users.find(u => u.id === Number(selectedAthleteId)); const activePeriodRaport = historicalRaports.find(r => r.athleteId === Number(selectedAthleteId) && r.period === activePeriodTab);

      const components = [
        { key: 'pukulan', label: 'Pukulan (Jireugi)' },
        { key: 'tangkisan', label: 'Tangkisan (Makki)' },
        { key: 'tendangan', label: 'Tendangan (Chagi)' },
        { key: 'kudaKuda', label: 'Sikap Kuda-Kuda (Seogi)' },
        { key: 'taegeuk', label: 'Jurus (Taegeuk / Poomsae)' },
        { key: 'kyorugi', label: 'Pertarungan (Kyorugi)' },
        { key: 'fisik', label: 'Kekuatan Fisik & Stamina' },
        { key: 'pengetahuan', label: 'Pengetahuan Umum Taekwondo' },
        { key: 'kyukpa', label: 'Pemecahan Papan (Kyukpa)' },
        { key: 'mental', label: 'Kerapian & Mental Spiritual (Attitude)' }
      ];

      // --- Fitur Edit & Hapus Raport (Khusus Super Admin) ---
      const handleStartEditRaport = (raport) => {
        setEditingRaportId(raport.id);
        setEditRaportData({ ...raport.raport });
      };

      const handleCancelEdit = () => {
        setEditingRaportId(null);
        setEditRaportData(null);
      };

      const handleSaveEditRaport = () => {
        if (!editRaportData || !editingRaportId) return;
        const raportToUpdate = historicalRaports.find(r => r.id === editingRaportId);
        if (!raportToUpdate) return;
        
        // Recalculate total score
        const totalScore = components.reduce((sum, comp) => sum + (Number(editRaportData[comp.key]) || 0), 0);
        const passStatus = totalScore >= 60 ? 'Lulus' : 'Tidak Lulus';
        
        const updatedRaport = {
          ...raportToUpdate,
          raport: { ...editRaportData, totalScore },
          passStatus
        };
        
        if (updateRaport) {
          updateRaport(editingRaportId, updatedRaport);
          triggerToast("Raport berhasil diperbarui!");
        }
        setEditingRaportId(null);
        setEditRaportData(null);
      };

      const handleDeleteRaport = (raportId) => {
        if (!window.confirm("Hapus raport ini secara permanen? Tindakan ini tidak dapat dibatalkan!")) return;
        if (deleteRaport) {
          deleteRaport(raportId);
          triggerToast("Raport berhasil dihapus!");
        }
      };

      // FUNGSI BACKUP DAN RESTORE KHUSUS DATA RAPORT (JSON)
      const clubFilteredRaports = user.role === 'super_admin' ? historicalRaports : historicalRaports.filter(r => { const a = users.find(u => u.id === r.athleteId); return a && a.club === user.club; });
      const handleDownloadRaportBackup = () => {
        if(clubFilteredRaports.length === 0) {
            triggerToast("Belum ada data raport untuk diunduh.", "error");
            return;
        }
        const blob = new Blob([JSON.stringify(clubFilteredRaports, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `Backup_Raport_UKT_${user.club}_${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast("Backup data Raport UKT berhasil diunduh!", "success");
      };

      const handleUploadRaportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if(Array.isArray(parsed)) {
                let successCount = 0;
                parsed.forEach(r => {
                    const exists = historicalRaports.find(ext => ext.id === r.id);
                    if(!exists) {
                        addRaport(r);
                        successCount++;
                    }
                });
                triggerToast(`${successCount} data raport berhasil dipulihkan ke Database!`, "success");
            } else {
                triggerToast("Format file tidak valid. Harap unggah file JSON Backup Raport.", "error");
            }
          } catch(err) {
            triggerToast("Gagal membaca file JSON.", "error");
          }
        };
        reader.readAsText(file);
      };

      return (

    function ChampionshipView({ user, events, addChamp, updateChamp, deleteChamp, registrations, addChampReg, updateChampReg, triggerToast, users, points, addPoint, poinRules }) {
      const [showAddForm, setShowAddForm] = useState(false); 
      const [title, setTitle] = useState(''); 
      const [level, setLevel] = useState('Kabupaten'); 
      const [date, setDate] = useState(''); 
      const [dateEnd, setDateEnd] = useState(''); 
      const [regDeadline, setRegDeadline] = useState(''); 
      const [cost, setCost] = useState(''); 
      const [selectedClassCategory, setSelectedClassCategory] = useState('Kyorugi (Prestasi)');
      const [eventType, setEventType] = useState('Kejuaraan');
      
      const [editingChampId, setEditingChampId] = useState(null);
      const [editChampData, setEditChampData] = useState({});

      const handleSubmit = (e) => { 
        e.preventDefault(); 
        addChamp({ id: Date.now(), title, type: eventType, level, date, dateEnd: dateEnd || date, regDeadline: regDeadline || date, cost: Number(cost), isOpen: true }); 
        setTitle(''); setDate(''); setDateEnd(''); setRegDeadline(''); setCost(''); setShowAddForm(false); triggerToast("Event ditambahkan (DB)!"); 
      };
      
      const handleStartEdit = (ev) => { setEditingChampId(ev.id); setEditChampData(ev); };
      const handleSaveEdit = (e) => { 
          e.preventDefault(); 
          updateChamp(editingChampId, { ...editChampData, cost: Number(editChampData.cost) }); 
          setEditingChampId(null); 
          triggerToast("Data event diperbarui!"); 
      };
      const handleDelete = (id) => { 
          if(window.confirm("Yakin hapus event ini secara permanen?")) { 
              deleteChamp(id); 
              triggerToast("Event dihapus!"); 
          } 
      };

      const handleRegisterEvent = (event) => { 
        if (registrations.find(r => r.champId === event.id && r.athleteId === user.id)) { 
          triggerToast("Sudah terdaftar.", "error"); return; 
        }
        const deadline = new Date(event.regDeadline || event.date);
        deadline.setHours(23, 59, 59, 999);
        if (new Date() > deadline) {
          triggerToast("Pendaftaran sudah ditutup! Batas pendaftaran: " + (event.regDeadline || event.date), "error"); return;
        } 
        addChampReg({ id: Date.now(), champId: event.id, athleteId: user.id, classCategory: selectedClassCategory, cost: event.cost, paymentStatus: 'pending' });
        // Auto poin untuk mengikuti event
        const eventType = event.type || 'Kejuaraan';
        const eventCategory = eventType === 'Kejuaraan' ? 'Event Kejuaraan' : eventType === 'Latihan Gabungan' ? 'Event LatGab' : 'Event Kegiatan Lain';
        const evPoinRule = (k, d) => (poinRules && poinRules[k] !== undefined ? poinRules[k] : d);
        const champPointMap = { 'Kabupaten': evPoinRule('event_kabupaten', 1), 'Provinsi': evPoinRule('event_provinsi', 2), 'Nasional': evPoinRule('event_nasional', 3) };
        const autoPoints = champPointMap[event.level] || 1;
        const existingChampPoint = points?.find(p => p.athleteId === user.id && p.eventName === event.title && p.category === eventCategory);
        if (!existingChampPoint && addPoint) {
          addPoint({ id: Date.now() + 1, athleteId: user.id, eventName: event.title, level: event.level, category: eventCategory, division: selectedClassCategory, achievement: 'Mengikuti Event', points: autoPoints });
        }
        triggerToast(`Berhasil mendaftar! +${autoPoints} Poin otomatis untuk mengikuti event ${event.level}.`); 
      };
      
      const handlePayEvent = (regId) => { 
        const target = registrations.find(r=>r.id===regId); 
        updateChampReg(regId, { ...target, paymentStatus: 'paid' }); 
        triggerToast("Pembayaran dikonfirmasi!"); 
      };

      const handleDownloadEventPDF = (event) => {
        const eventRegs = registrations.filter(r => r.champId === event.id);
        if (eventRegs.length === 0) {
            triggerToast("Belum ada peserta yang mendaftar event ini.", "error");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(185, 28, 28);
        doc.text("DAFTAR PESERTA EVENT TAEKWONDO", 105, 15, { align: "center" });
        
        doc.setFontSize(11);
        doc.setTextColor(30, 41, 59);
        doc.text(event.title.toUpperCase(), 105, 22, { align: "center" });
        
        doc.setFontSize(9);
        doc.setFont("helvetica", "normal");
        doc.text(`Kategori: ${event.type} | Tanggal: ${event.date}${event.dateEnd && event.dateEnd !== event.date ? ` s/d ${event.dateEnd}` : ''} | Tingkat: ${event.level}`, 105, 28, { align: "center" });
        if (event.regDeadline) {
          doc.setFontSize(8);
          doc.setTextColor(220, 38, 38);
          doc.text(`Batas Pendaftaran: ${event.regDeadline}`, 105, 33, { align: "center" });
        }

        const headers = [["No", "Nama Atlet", "Dojang / Club", "Kategori Kelas", "Status Pembayaran"]];
        const tableData = eventRegs.map((reg, index) => {
            const athlete = users.find(u => u.id === reg.athleteId);
            return [
                index + 1,
                athlete?.name || "-",
                athlete?.club || "-",
                reg.classCategory || "-",
                reg.paymentStatus === 'paid' ? "LUNAS" : "PENDING"
            ];
        });

        doc.autoTable({
            head: headers,
            body: tableData,
            startY: event.regDeadline ? 40 : 35,
            theme: 'grid',
            headStyles: { fillColor: [185, 28, 28], textColor: [255, 255, 255] },
            styles: { fontSize: 8.5, cellPadding: 2.5 },
            columnStyles: { 0: { cellWidth: 10, halign: 'center' } }
        });

        doc.save(`Daftar_Peserta_${event.title.replace(/\s+/g, '_')}.pdf`);
        triggerToast("PDF Peserta Event Berhasil Diunduh!");
      };
      
      return (
        <div className="space-y-4">
          <div className="flex items-center gap-2 border-b pb-2"><Icon name="Award" className="w-5 h-5 text-red-600" /><h2 className="text-lg font-black text-gray-800">Manajemen Event</h2></div>
          {user.role === 'super_admin' && <button onClick={() => setShowAddForm(!showAddForm)} className="w-full bg-red-50 text-red-700 py-2.5 rounded-xl font-bold text-xs flex justify-center items-center gap-1.5 border border-red-200"><Icon name="Plus" className="w-4 h-4 text-red-600" /> {showAddForm ? 'Batal' : 'Buat Event Baru'}</button>}
          {showAddForm && (
            <form onSubmit={handleSubmit} className="bg-red-50/70 p-4 rounded-3xl border space-y-3">
              <input type="text" placeholder="Nama Event" value={title} onChange={e => setTitle(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl" required />
              <div className="grid grid-cols-2 gap-2">
                <select value={eventType} onChange={e => setEventType(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl"><option value="Kejuaraan">Kejuaraan</option><option value="Latihan Gabungan">Latihan Gabungan</option><option value="Diklat">Diklat</option><option value="Lainnya">Lainnya</option></select>

    function PointsView({ user, points, addPoint, updatePoint, deletePoint, users, clubs, triggerToast, poinRules, updatePointSetting }) {
      const isAtletOrPelatih = user.role === 'atlet' || user.role === 'pelatih';
      const [pointTab, setPointTab] = useState(user.role === 'atlet' ? 'poinku' : user.role === 'pelatih' ? 'clubSaya' : 'leaderboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [showAddPoint, setShowAddPoint] = useState(false); const [athleteId, setAthleteId] = useState(''); const [eventName, setEventName] = useState(''); const [category, setCategory] = useState('Kyorugi'); const [division, setDivision] = useState('Prestasi'); const [medal, setMedal] = useState('Emas'); const [level, setLevel] = useState('Kabupaten'); const [leaderboardFilter, setLeaderboardFilter] = useState('Semua');
      const [athleteSearch, setAthleteSearch] = useState('');
      const [showAthleteDropdown, setShowAthleteDropdown] = useState(false);
      
      const [weightClass, setWeightClass] = useState('');
      const [poomsaeCategory, setPoomsaeCategory] = useState('Individu');
      const [poomsaeScore, setPoomsaeScore] = useState('');

      const [editingPointId, setEditingPointId] = useState(null);
      const [editPointData, setEditPointData] = useState({});
      const [manualPoints, setManualPoints] = useState('');
      const [editPointsOverride, setEditPointsOverride] = useState('');
      const [ruleDraft, setRuleDraft] = useState({});
      
      // State baru untuk fitur Lihat Riwayat
      const [viewingHistoryAthleteId, setViewingHistoryAthleteId] = useState(null);

      // State untuk fitur lihat poin club
      const [clubSayaFilter, setClubSayaFilter] = useState('Semua');
      const [clubSayaSearch, setClubSayaSearch] = useState('');
      const [semuaClubFilter, setSemuaClubFilter] = useState('Semua');
      const [semuaClubSearch, setSemuaClubSearch] = useState('');
      const [semuaClubClubFilter, setSemuaClubClubFilter] = useState('Semua');

      const athletes = users.filter(u => u.role === 'atlet' && (user.role === 'super_admin' || u.club === user.club));

      const calculateTotal = (atId, filterType) => points.filter(p => p.athleteId === atId && (filterType === 'Semua' || p.category === filterType)).reduce((sum, p) => sum + p.points, 0);

      // Data atlet untuk fitur Club Saya (atlet & pelatih lihat seluruh atlet dalam 1 club)
      const clubSayaAthletes = users.filter(u => u.role === 'atlet' && u.club === user.club);
      const clubSayaSorted = [...clubSayaAthletes].sort((a, b) => calculateTotal(b.id, clubSayaFilter) - calculateTotal(a.id, clubSayaFilter));
      const clubSayaSearched = clubSayaSorted.filter(a => {
        if (!clubSayaSearch) return true;
        const q = clubSayaSearch.toLowerCase();
        return (a.name || '').toLowerCase().includes(q) || (a.sabuk || '').toLowerCase().includes(q);
      });
      const clubSayaTotalPoints = clubSayaAthletes.reduce((sum, a) => sum + calculateTotal(a.id, clubSayaFilter), 0);

      // Data atlet untuk fitur Semua Club (atlet & pelatih lihat seluruh atlet dari beberapa club)
      const semuaClubAthletes = users.filter(u => u.role === 'atlet');
      const semuaClubSorted = [...semuaClubAthletes]
        .filter(a => semuaClubClubFilter === 'Semua' || a.club === semuaClubClubFilter)
        .sort((a, b) => calculateTotal(b.id, semuaClubFilter) - calculateTotal(a.id, semuaClubFilter));
      const semuaClubSearched = semuaClubSorted.filter(a => {
        if (!semuaClubSearch) return true;
        const q = semuaClubSearch.toLowerCase();
        return (a.name || '').toLowerCase().includes(q) || (a.club || '').toLowerCase().includes(q) || (a.sabuk || '').toLowerCase().includes(q);
      });
      const semuaClubTotalPoints = semuaClubAthletes.reduce((sum, a) => sum + calculateTotal(a.id, semuaClubFilter), 0);
      // Club unik untuk filter di Semua Club
      const uniqueClubs = [...new Set(semuaClubAthletes.map(a => a.club).filter(Boolean))].sort();
      // Statistik per club
      const clubStats = uniqueClubs.map(clubName => {
        const clubAtlets = semuaClubAthletes.filter(a => a.club === clubName);
        const totalPoin = clubAtlets.reduce((sum, a) => sum + calculateTotal(a.id, semuaClubFilter), 0);
        return { name: clubName, atletCount: clubAtlets.length, totalPoin };
      }).sort((a, b) => b.totalPoin - a.totalPoin);

      const filteredAthletes = athletes.filter(a => {
        if (!athleteSearch) return true;
        const q = athleteSearch.toLowerCase();
        return (a.name || '').toLowerCase().includes(q) || (a.club || '').toLowerCase().includes(q) || (a.sabuk || '').toLowerCase().includes(q);
      });
      const selectedAthleteObj = athletes.find(a => String(a.id) === String(athleteId));
      
      const isEventCategory = (cat) => cat === 'Event Kejuaraan' || cat === 'Event LatGab' || cat === 'Event Kegiatan Lain';

      const ruleVal = (k, d) => (poinRules && poinRules[k] !== undefined ? Number(poinRules[k]) : d);
      const getAutomaticPoints = (cat, div, mdl, lvl) => {
        const L = String(lvl || '').toLowerCase();
        if (cat === 'UKT/Diklat') return mdl === 'Lulus UKT' ? ruleVal('ukt_lulus', 5) : ruleVal('ukt_mengikuti', 3);
        if (isEventCategory(cat)) return ruleVal('event_' + L, 1);
        if (mdl === 'Partisipasi') return ruleVal('partisipasi_' + L, 1);
        if (div === 'Pemula') {
          if (mdl === 'Emas') return ruleVal('pemula_emas_' + L, L === 'kabupaten' ? 1 : L === 'provinsi' ? 2 : 3);
          if (mdl === 'Perak') return ruleVal('pemula_perak_' + L, L === 'kabupaten' ? 0 : L === 'provinsi' ? 1 : 2);
          if (mdl === 'Perunggu') return ruleVal('pemula_perunggu_' + L, L === 'kabupaten' ? 0 : L === 'provinsi' ? 1 : 2);
        }
        if (div === 'Semi Prestasi') {
          if (mdl === 'Emas') return ruleVal('semiprestasi_emas_' + L, L === 'kabupaten' ? 2 : L === 'provinsi' ? 3 : 4);
          if (mdl === 'Perak') return ruleVal('semiprestasi_perak_' + L, L === 'kabupaten' ? 1 : L === 'provinsi' ? 2 : 3);
          if (mdl === 'Perunggu') return ruleVal('semiprestasi_perunggu_' + L, L === 'kabupaten' ? 0 : L === 'provinsi' ? 1 : 2);
        }
        if (div === 'Prestasi') {
          if (mdl === 'Emas') return ruleVal('prestasi_emas_' + L, L === 'kabupaten' ? 3 : L === 'provinsi' ? 4 : 5);
          if (mdl === 'Perak') return ruleVal('prestasi_perak_' + L, L === 'kabupaten' ? 2 : L === 'provinsi' ? 3 : 4);
          if (mdl === 'Perunggu') return ruleVal('prestasi_perunggu_' + L, L === 'kabupaten' ? 1 : L === 'provinsi' ? 2 : 3);
        }
        return 0;
      };
      
      const handleAddPointSubmit = (e) => { 
        e.preventDefault(); 
        const autoPointsVal = getAutomaticPoints(category, division, medal, level);
        const calculatedPoints = manualPoints !== '' && !isNaN(Number(manualPoints)) ? Number(manualPoints) : autoPointsVal; 
        let achievementText = medal === 'Partisipasi' ? 'Partisipasi' : `Juara (${medal})`;
        if (category === 'UKT/Diklat') achievementText = medal === 'Lulus UKT' ? 'Lulus UKT' : 'Mengikuti UKT';
        if (isEventCategory(category)) achievementText = medal === 'Partisipasi' ? 'Mengikuti Event' : `Juara (${medal})`;

        addPoint({ 
          id: Date.now(), athleteId: parseInt(athleteId), eventName, level, category, division, 
          achievement: achievementText, points: calculatedPoints,
          weightClass: category === 'Kyorugi' ? weightClass : '',
          poomsaeCategory: category === 'Poomsae' ? poomsaeCategory : '',
          score: category === 'Poomsae' ? poomsaeScore : ''
        }); 
        setEventName(''); setWeightClass(''); setPoomsaeScore(''); setShowAddPoint(false); setManualPoints(''); triggerToast(`Sukses! (+${calculatedPoints} POIN) disimpan di DB.`); 
      };

      const handleStartEditPoint = (p) => {
        let currentMedal = 'Partisipasi';
        if (p.achievement.includes('Emas')) currentMedal = 'Emas';
        else if (p.achievement.includes('Perak')) currentMedal = 'Perak';
        else if (p.achievement.includes('Perunggu')) currentMedal = 'Perunggu';
        else if (p.achievement.includes('Lulus')) currentMedal = 'Lulus UKT';
        else if (p.category === 'UKT/Diklat') currentMedal = 'Mengikuti UKT';
        else if (p.achievement.includes('Mengikuti Event')) currentMedal = 'Partisipasi';
        
        setEditingPointId(p.id);
        setEditPointData({...p, medal: currentMedal});
        setEditPointsOverride('');
      };

      const handleSaveEditPoint = (e) => {
        e.preventDefault();
        const autoPointsEdit = getAutomaticPoints(editPointData.category, editPointData.division, editPointData.medal, editPointData.level);
        const calculatedPoints = editPointsOverride !== '' && !isNaN(Number(editPointsOverride)) ? Number(editPointsOverride) : autoPointsEdit; 
        let achievementText = editPointData.medal === 'Partisipasi' ? 'Partisipasi' : `Juara (${editPointData.medal})`;
        if (editPointData.category === 'UKT/Diklat') achievementText = editPointData.medal === 'Lulus UKT' ? 'Lulus UKT' : 'Mengikuti UKT';
        if (isEventCategory(editPointData.category)) achievementText = editPointData.medal === 'Partisipasi' ? 'Mengikuti Event' : `Juara (${editPointData.medal})`;
        
        updatePoint(editingPointId, {
          ...editPointData,
          points: calculatedPoints,
          achievement: achievementText
        });
        setEditingPointId(null);
        triggerToast("Data poin berhasil diperbarui!");
      };

      const handleDeletePoint = (id) => {
        if (window.confirm("Yakin ingin menghapus riwayat poin ini?")) {
          deletePoint(id);
          triggerToast("Riwayat poin dihapus permanen.");
        }
      };
      // ===== PENGATURAN POIN KEGIATAN (Super Admin) =====
      const handleSavePoinRules = () => {
        const ids = Object.keys(ruleDraft);
        const valid = ids.filter(id => ruleDraft[id] !== '' && !isNaN(Number(ruleDraft[id])));
        if (valid.length === 0) { triggerToast("Tidak ada nilai baru untuk disimpan.", "error"); return; }
        valid.forEach(id => {
          const rule = POINT_RULES.find(r => r.id === id);
          updatePointSetting(id, { id, label: rule ? rule.label : id, value: Number(ruleDraft[id]) });
        });
        setRuleDraft({});
        triggerToast(valid.length + " pengaturan poin tersimpan ke Database!");
      };

      const handleResetPoinRules = () => {
        if (!window.confirm("Pulihkan SEMUA pengaturan poin ke nilai default?")) return;
        POINT_RULES.forEach(r => updatePointSetting(r.id, { id: r.id, label: r.label, value: r.def }));
        setRuleDraft({});
        triggerToast("Pengaturan poin dikembalikan ke nilai default!");
      };


      // FUNGSI UNDUH PDF
      const handleDownloadPointsPDF = (targetAthleteId) => {
        const athlete = users.find(u => u.id === targetAthleteId);
        if (!athlete) return;
        const history = points.filter(p => p.athleteId === targetAthleteId).reverse();
        if (history.length === 0) {
            triggerToast("Belum ada riwayat poin untuk dicetak.", "error");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Kop Surat
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(185, 28, 28);
        doc.text("RIWAYAT POIN PRESTASI ATLET", 105, 15, { align: "center" });
        
        // Info Atlet
        doc.setFontSize(10);
        doc.setTextColor(50, 50, 50);
        doc.text(`Nama: ${athlete.name} | Dojang: ${athlete.club}`, 105, 22, { align: "center" });
        doc.text(`Sabuk: ${athlete.sabuk ? athlete.sabuk.split(' (')[0] : '-'} | Total Poin: ${calculateTotal(targetAthleteId, 'Semua')} POIN`, 105, 27, { align: "center" });

        // Tabel Riwayat
        const headers = [["No", "Nama Event", "Kategori & Divisi", "Pencapaian", "Poin"]];
        const data = history.map((p, i) => [
            i + 1,
            p.eventName + (p.level ? ` (${p.level})` : ''),
            `${p.category} ${p.division ? '- ' + p.division : ''}`,
            p.achievement,
            `+${p.points}`
        ]);

        doc.autoTable({
            head: headers,
            body: data,
            startY: 35,
            theme: 'grid',

                                <div key={a.id} onMouseDown={() => { setAthleteId(a.id); setAthleteSearch(a.name); setShowAthleteDropdown(false); }} className={`p-2.5 cursor-pointer hover:bg-red-50 border-b border-gray-100 flex justify-between items-center ${String(a.id) === String(athleteId) ? 'bg-red-50' : ''}`}>
                                  <div>
                                    <div className="text-xs font-bold text-gray-800">{a.name}</div>
                                    <div className="text-[9px] text-gray-500 font-medium">{a.club} • {a.sabuk}</div>

                                  <Icon name="Check" className={`w-4 h-4 text-red-600 ${String(a.id) === String(athleteId) ? '' : 'opacity-0'}`} />

                            </div>

                          {selectedAthleteObj && <div className="mt-1.5 bg-green-50 border border-green-200 rounded-xl p-2 text-[10px] font-bold text-green-700 flex items-center gap-1.5"><Icon name="CheckCircle" className="w-3.5 h-3.5" /> {selectedAthleteObj.name} • {selectedAthleteObj.club} • {selectedAthleteObj.sabuk}</div>}
                        </div>
                        <input type="text" placeholder="Nama Kejuaraan / Turnamen / Event" value={eventName} onChange={e => setEventName(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl" required />
                        
                        <div className="grid grid-cols-2 gap-2">
                          <select value={category} onChange={e => setCategory(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl"><option value="Kyorugi">Kyorugi</option><option value="Poomsae">Poomsae</option><option value="UKT/Diklat">UKT/Diklat</option><option value="Event Kejuaraan">Event Kejuaraan</option><option value="Event LatGab">Event LatGab</option><option value="Event Kegiatan Lain">Event Kegiatan Lain</option></select>
                          <select value={division} onChange={e => setDivision(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl"><option value="Prestasi">Prestasi</option><option value="Semi Prestasi">Semi Prestasi</option><option value="Pemula">Pemula</option></select>
                        </div>

                        {category === 'Kyorugi' && (
                          <input type="text" placeholder="Kelas Berat (misal: U-54 Kg Putra)" value={weightClass} onChange={e => setWeightClass(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl border-blue-200" required />
                        )}
                        {category === 'Poomsae' && (
                          <div className="grid grid-cols-2 gap-2">
                            <select value={poomsaeCategory} onChange={e => setPoomsaeCategory(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl border-green-200"><option value="Individu">Individu</option><option value="Berpasangan">Berpasangan</option><option value="Beregu">Beregu</option></select>
                            <input type="number" step="0.01" placeholder="Skor Poomsae (opsional)" value={poomsaeScore} onChange={e => setPoomsaeScore(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl border-green-200" />
                          </div>
                        )}

                        <div className="grid grid-cols-2 gap-2">
                          {category === 'UKT/Diklat' ? (
                            <select value={medal} onChange={e => setMedal(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl"><option value="Lulus UKT">Lulus UKT</option><option value="Mengikuti UKT">Mengikuti UKT</option></select>
                          ) : (
                            <select value={medal} onChange={e => setMedal(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl"><option value="Emas">Emas</option><option value="Perak">Perak</option><option value="Perunggu">Perunggu</option><option value="Partisipasi">Partisipasi (Peserta)</option></select>
                          )}
                          <select value={level} onChange={e => setLevel(e.target.value)} className="w-full text-xs p-2.5 bg-white border rounded-xl"><option value="Kabupaten">Kabupaten</option><option value="Provinsi">Provinsi</option><option value="Nasional">Nasional</option></select>
                        </div>
                        
                        <div className="p-2.5 bg-amber-50 rounded-xl space-y-2">
                          <div className="flex justify-between items-center text-[10px] font-bold text-amber-800 uppercase">
                            <span>Nilai Poin</span>
                            <span>Otomatis: <span className="text-sm font-black text-red-700">+{getAutomaticPoints(category, division, medal, level)}</span></span>
                          </div>
                          <input type="number" min="0" value={manualPoints} onChange={e => setManualPoints(e.target.value)} placeholder="Kosongkan = pakai nilai otomatis" className="w-full text-xs p-2 bg-white border border-amber-200 rounded-xl text-center font-black text-red-700" />
                          <p className="text-[9px] text-amber-700 font-bold text-center">Nilai otomatis mengikuti menu Pengaturan Poin. Isi angka untuk menentukan poin manual.</p>
                        </div>
                        <button type="submit" className="w-full bg-red-700 text-white py-2.5 rounded-xl font-bold text-xs shadow">Submit Poin & Data (DB)</button>
                      </form>
                    )}
                    
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icon name="Search" className="w-4 h-4 text-gray-400" /></div>
                      <input type="text" placeholder="Cari nama atlet di klasemen..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full text-xs pl-9 p-2.5 bg-white border border-gray-200 rounded-xl focus:ring-1 focus:ring-red-500" />
                    </div>

                    <div className="grid gap-1 text-center text-[10px] font-bold" style={{gridTemplateColumns: 'repeat(auto-fit, minmax(0, 1fr))'}}>{['Semua', 'Kyorugi', 'Poomsae', 'UKT/Diklat', 'Event', 'LatGab', 'Lainnya'].map(cat => (<button key={cat} onClick={() => setLeaderboardFilter(cat === 'Event' ? 'Event Kejuaraan' : cat === 'LatGab' ? 'Event LatGab' : cat === 'Lainnya' ? 'Event Kegiatan Lain' : cat)} className={`p-2 rounded-xl transition border ${leaderboardFilter === (cat === 'Event' ? 'Event Kejuaraan' : cat === 'LatGab' ? 'Event LatGab' : cat === 'Lainnya' ? 'Event Kegiatan Lain' : cat) ? 'bg-red-700 text-white border-red-700 shadow-sm' : 'bg-white text-gray-500 border-gray-200'}`}>{cat}</button>))}</div>

                    {/* ===== BLOK REKAP PDF BERDASARKAN KATEGORI (KHUSUS SUPER ADMIN) ===== */}
                    {user.role === 'super_admin' && (
                      <div className="bg-gradient-to-br from-amber-50 to-yellow-50 border-2 border-amber-300 rounded-2xl p-3 space-y-2 shadow-sm animate-fade-in">
                        <div className="flex items-center gap-2 text-[10px] font-black text-amber-900 uppercase tracking-wider">
                          <Icon name="Award" className="w-4 h-4 text-amber-700" />
                          <span>Super Admin &middot; Rekap PDF per Kategori</span>
                        </div>
                        <p className="text-[10px] text-amber-800 leading-relaxed">
                          Pilih kategori pada filter di atas, lalu klik <b>Unduh PDF Kategori Ini</b> untuk mencetak rekap atlet berpoin beserta detail riwayatnya. Atau gunakan <b>Unduh Semua Kategori</b> untuk rekap gabungan seluruh kategori dalam satu file PDF.
                        </p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                          <button
                            onClick={() => handleDownloadCategoryPointsPDF(leaderboardFilter)}
                            className="bg-red-700 hover:bg-red-800 active:scale-[0.98] text-white py-2.5 px-3 rounded-xl text-[10px] font-bold shadow-sm flex items-center justify-center gap-1.5 transition"
                            title={`Unduh PDF untuk kategori: ${leaderboardFilter}`}
                          >
                            <Icon name="Download" className="w-3.5 h-3.5" />
                            Unduh PDF Kategori &ldquo;{leaderboardFilter === 'Event Kejuaraan' ? 'Event' : leaderboardFilter === 'Event LatGab' ? 'LatGab' : leaderboardFilter === 'Event Kegiatan Lain' ? 'Lainnya' : leaderboardFilter}&rdquo;
                          </button>
                          <button
                            onClick={handleDownloadAllCategoriesPDF}
                            className="bg-amber-700 hover:bg-amber-800 active:scale-[0.98] text-white py-2.5 px-3 rounded-xl text-[10px] font-bold shadow-sm flex items-center justify-center gap-1.5 transition"
                            title="Unduh rekap gabungan seluruh kategori dalam satu PDF"
                          >
                            <Icon name="FileText" className="w-3.5 h-3.5" />
                            Unduh Semua Kategori (PDF)
                          </button>
                        </div>
                      </div>
                    )}
                    {/* ===== END BLOK REKAP PDF ===== */}

                    <div className="bg-white rounded-3xl shadow-sm border overflow-hidden">
                       <div className="bg-red-50 p-3 font-extrabold text-xs text-red-800 uppercase flex justify-between"><span>Ranking</span><span>Poin & Riwayat</span></div>
                       <div className="divide-y divide-gray-100">
                          {searchedAthletes.map((atlet, index) => (
                             <div key={atlet.id} className="p-3 flex justify-between items-center hover:bg-gray-50 transition">
                                <div className="flex items-center gap-3 pr-2 min-w-0">
                                   <span className={`font-black text-sm w-5 shrink-0 text-center ${index === 0 ? 'text-yellow-500' : 'text-gray-400'}`}>{index + 1}</span>
                                   <div className="min-w-0">
                                      <div className="font-extrabold text-sm text-gray-800 truncate">{atlet.name}</div>
                                      <div className="text-[10px] text-gray-500 font-medium mt-0.5 truncate"><span className={getBeltBadgeClass(atlet.sabuk)}>{atlet.sabuk}</span></div>
                                   </div>
                                </div>
                                <div className="flex flex-col items-end gap-1.5 shrink-0">
                                   <div className="font-black text-red-700 bg-red-50 px-2 py-0.5 rounded-lg text-xs border border-red-100 shadow-sm">{calculateTotal(atlet.id, leaderboardFilter)} POIN</div>
                                   <button onClick={() => setViewingHistoryAthleteId(atlet.id)} className="text-[9px] font-bold text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded shadow-sm transition flex items-center gap-1">
                                      <Icon name="List" className="w-3 h-3"/> Riwayat
                                   </button>
                                </div>
                             </div>
                          ))}
                       </div>
                    </div>
                 </>
              )}
            </div>
          )}
        </div>
      );
    }

    function AccountManager({ user, users, addUser, updateUser, deleteUser, clubs, addClub, deleteClub, triggerToast, featureSettings, updateFeatureSettings }) {
      const [managerTab, setManagerTab] = useState('pengguna'); const [showAddAccount, setShowAddAccount] = useState(false); const [editingUserId, setEditingUserId] = useState(null);
      const [ktaUser, setKtaUser] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [sabukFilter, setSabukFilter] = useState('Semua');
      const [license, setLicense] = useState(''); 
      
      const [newClubName, setNewClubName] = useState('');
      const [editingClubIndex, setEditingClubIndex] = useState(null);
      const [editClubNameValue, setEditClubNameValue] = useState('');
      
      // State variabel untuk form tambah/edit akun
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('atlet');
      const [club, setClub] = useState(user.role === 'super_admin' ? (clubs[0] || 'Pusat Mura') : user.club);
      const [sabuk, setSabuk] = useState('Sabuk Putih Polos (Geup 10)');
      const [gender, setGender] = useState('Laki-laki');
      const [placeOfBirth, setPlaceOfBirth] = useState('');
      const [dateOfBirth, setDateOfBirth] = useState('');
      const [regNo, setRegNo] = useState('');

      const isSabukVisible = role === 'atlet' || role === 'pelatih';

      const visibleUsers = users.filter(u => {
        const matchRoleClub = user.role === 'super_admin' || u.club === user.club;
        const matchSearch = u.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            (u.regNo && u.regNo.toLowerCase().includes(searchQuery.toLowerCase()));
        const matchSabuk = sabukFilter === 'Semua' || 
                           (sabukFilter === 'Tanpa Sabuk' ? (!u.sabuk || u.role === 'super_admin' || u.role === 'pengurus_club') : u.sabuk === sabukFilter);
        return matchRoleClub && matchSearch && matchSabuk;
      }).sort((a, b) => {
        // Urutkan berdasarkan tingkatan sabuk (beltSequence), tanpa sabuk di akhir
        const aIdx = a.sabuk ? beltSequence.indexOf(a.sabuk) : 999;
        const bIdx = b.sabuk ? beltSequence.indexOf(b.sabuk) : 999;
        if (aIdx !== bIdx) return aIdx - bIdx;
        // Jika sama sabuknya, urutkan berdasarkan nama
        return (a.name || '').localeCompare(b.name || '', 'id');
      });

      // --- LOGIKA STATISTIK SABUK (MENGHITUNG SELURUH DATA, TIDAK TERPENGARUH PENCARIAN) ---
      const baseStatUsers = users.filter(u => user.role === 'super_admin' || u.club === user.club);
      const beltStats = {};
      beltSequence.forEach(b => beltStats[b] = 0);
      baseStatUsers.forEach(u => {
         if ((u.role === 'atlet' || u.role === 'pelatih') && u.sabuk && beltStats[u.sabuk] !== undefined) {
             beltStats[u.sabuk]++;
         }
      });
      const activeBelts = beltSequence.filter(b => beltStats[b] > 0);
      // -------------------------------

      const handleStartEdit = (targetUser) => { 
        setEditingUserId(targetUser.id); 
        setUsername(targetUser.username || ''); 
        setPassword(targetUser.password || ''); 
        setName(targetUser.name); 
        setEmail(targetUser.email); 
        setRole(targetUser.role); 
        setClub(targetUser.club || user.club); 
        setSabuk(targetUser.sabuk || 'Sabuk Putih Polos (Geup 10)'); 
        setGender(targetUser.gender || 'Laki-laki'); 
        setPlaceOfBirth(targetUser.placeOfBirth || ''); 
        setDateOfBirth(targetUser.dateOfBirth || ''); 
        setRegNo(targetUser.regNo || ''); 
        setLicense(targetUser.license || ''); 
        setShowAddAccount(false); // Sembunyikan form tambah di atas agar fokus ke edit inline
      };

      const handleCancelEdit = () => { 
        setEditingUserId(null); setUsername(''); setPassword(''); setName(''); setEmail(''); setRole('atlet'); setClub(user.role === 'super_admin' ? (clubs[0] || 'Pusat Mura') : user.club); setSabuk('Sabuk Putih Polos (Geup 10)'); setGender('Laki-laki'); setPlaceOfBirth(''); setDateOfBirth(''); setRegNo(''); setLicense(''); setShowAddAccount(false); 
      };

      const handleDelete = (id) => { if (window.confirm('Hapus akun ini dari Database?')) { deleteUser(id); triggerToast("Akun terhapus dari Database."); } };
      
      const handleAddAccountSubmit = (e) => {
        e.preventDefault(); 
        if (!name.trim() || !username.trim() || !password.trim()) { triggerToast("Lengkapi form!", "error"); return; }
        let finalRegNo = regNo.trim(); 
        if ((role === 'atlet' || role === 'pelatih') && !finalRegNo) {
          finalRegNo = 'REG-' + Math.floor(1000000000 + Math.random() * 9000000000); 
        } else if (role !== 'atlet' && role !== 'pelatih') {
          finalRegNo = '';
        }
        
        const licenseValue = role === 'pelatih' ? license.trim() : '';
        const assignedClub = user.role === 'super_admin' ? club : user.club; 

        if (editingUserId) { 
          const existing = users.find(u => u.id === editingUserId);
          updateUser(editingUserId, { 
            ...existing, username, password, name, email, role, club: assignedClub, gender, 
            placeOfBirth: placeOfBirth || 'Musi Rawas', dateOfBirth: dateOfBirth || '2010-01-01', 
            regNo: finalRegNo, sabuk: isSabukVisible ? sabuk : null, license: licenseValue 
          }); 
          triggerToast(`Profil & Status ${name} diperbarui ke DB!`); 
        } else { 
          addUser({ 
            id: Date.now(), username, password, name, email, role, club: assignedClub, gender, 
            placeOfBirth: placeOfBirth || 'Musi Rawas', dateOfBirth: dateOfBirth || '2010-01-01', 
            regNo: finalRegNo, sabuk: isSabukVisible ? sabuk : null, license: licenseValue,
            status: 'Aktif', suspendedUntil: null, avatar: '', createdAt: new Date().toISOString() 
          }); 
          triggerToast(`Akun ${name} (${role}) tersimpan di DB!`); 
        }
        handleCancelEdit();
      };

      const handleAddClub = (e) => { e.preventDefault(); if (!newClubName.trim() || clubs.includes(newClubName.trim())) { triggerToast("Nama club tidak valid atau sudah ada.", "error"); return; } addClub({ id: newClubName.trim(), name: newClubName.trim() }); setNewClubName(''); triggerToast("Club masuk DB!"); };
      const handleDeleteClub = (index) => { if (window.confirm("Hapus club dari Database?")) { deleteClub(clubs[index]); triggerToast("Club dihapus dari DB."); } };
      
      const handleEditClubStart = (index, currentName) => { setEditingClubIndex(index); setEditClubNameValue(currentName); };
      const handleEditClubSave = (e, index) => { 
        e.preventDefault(); 
        const newName = editClubNameValue.trim(); 
        if (!newName || (clubs.includes(newName) && clubs[index] !== newName)) { triggerToast("Nama club tidak valid atau sudah ada.", "error"); return; } 
        const oldName = clubs[index]; 
        
        deleteClub(oldName);
        addClub({ id: newName, name: newName });
        
        users.forEach(u => {
          if (u.club === oldName) updateUser(u.id, { ...u, club: newName });
        });
        
        setEditingClubIndex(null); triggerToast("Data Club dan Anggota berhasil tersinkron ke DB!"); 
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          const lines = text.split('\n');
          if(lines.length < 2) return;
          
          const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
          let successCount = 0;
          
          lines.slice(1).forEach((line, index) => {
            if (!line.trim()) return;
            let values = [];
            let inQuotes = false;
            let currentVal = '';
            for (let i = 0; i < line.length; i++) {
              if (line[i] === '"') { inQuotes = !inQuotes; }
              else if (line[i] === ',' && !inQuotes) { values.push(currentVal); currentVal = ''; }
              else { currentVal += line[i]; }
            }
            values.push(currentVal);
            values = values.map(v => v.trim().replace(/"/g, ''));
            
            let newUser = { id: Date.now() + index, avatar: '', status: 'Aktif', suspendedUntil: null, createdAt: new Date().toISOString() };
            
            headers.forEach((header, i) => {
               let val = values[i] || '';
               if (val.toLowerCase() === 'null') val = null;
               if (header === 'gender' && val) {
                  val = val.toUpperCase().includes('PEREMPUAN') ? 'Perempuan' : 'Laki-laki';
               }
               if (header === 'sabuk' && val) {
                  if(val.toUpperCase().includes('PUTIH')) val = 'Sabuk Putih Polos (Geup 10)';
                  else if(val.toUpperCase().includes('KUNING POLOS')) val = 'Sabuk Kuning Polos (Geup 9)';
               }
               newUser[header] = val;
            });
            
            if (user.role !== 'super_admin') {
              newUser.club = user.club; 
              if (newUser.role === 'super_admin' || newUser.role === 'pengurus_club') {
                newUser.role = 'atlet'; 
              }
            }
            
            if (newUser.username && !users.find(u => u.username === newUser.username)) {
              addUser(newUser);
              successCount++;
            }
          });
          triggerToast(`${successCount} Akun berhasil diimpor dari CSV ke Database!`);
        };
        reader.readAsText(file);
      };

      const handleDownloadCSV = () => {
        const headers = ['ID', 'Nama Lengkap', 'Username', 'Email', 'Peran', 'Dojang', 'Sabuk', 'Jenis Kelamin', 'Tempat Lahir', 'Tanggal Lahir', 'No. Registrasi', 'Lisensi Pelatih', 'Status Akun', 'Batas Blokir Sanksi'];
        
        const rows = visibleUsers.map(u => [
          u.id, 
          `"${(u.name || '').replace(/"/g, '""')}"`, 
          `"${(u.username || '').replace(/"/g, '""')}"`, 
          `"${(u.email || '').replace(/"/g, '""')}"`, 
          u.role, 
          `"${(u.club || '').replace(/"/g, '""')}"`, 
          `"${(u.sabuk || '-').replace(/"/g, '""')}"`, 
          u.gender || '-', 
          `"${(u.placeOfBirth || '-').replace(/"/g, '""')}"`, 
          u.dateOfBirth || '-', 
          `"${(u.regNo || '-').replace(/"/g, '""')}"`, 
          `"${(u.license || '-').replace(/"/g, '""')}"`, 
          `"${u.status}"`, 
          `"${u.suspendedUntil || '-'}"`
        ]);

        const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "Data_Pengguna_TIMura.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast("Data pengguna berhasil diunduh!");
      };

      // ====================================================================
      // FUNGSI CETAK PDF AKUN DIURUTKAN BERDASARKAN SABUK (KHUSUS SUPER ADMIN)
      // Mencetak daftar seluruh akun dikelompokkan per tingkatan sabuk
      // ====================================================================
      const handleDownloadAccountsPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Kelompokkan pengguna berdasarkan sabuk (pakai beltSequence untuk urutan)
        const grouped = {};
        const noBeltUsers = []; // pengguna tanpa sabuk (super_admin, pengurus_club)

        beltSequence.forEach(b => grouped[b] = []);
        baseStatUsers.forEach(u => {
          if (u.sabuk && grouped[u.sabuk]) {
            grouped[u.sabuk].push(u);
          } else {
            noBeltUsers.push(u);
          }
        });

        // Hitung statistik
        const totalUsers = baseStatUsers.length;
        const totalAtlet = baseStatUsers.filter(u => u.role === 'atlet').length;
        const totalPelatih = baseStatUsers.filter(u => u.role === 'pelatih').length;
        const totalPengurus = baseStatUsers.filter(u => u.role === 'pengurus_club').length;
        const totalSuperAdmin = baseStatUsers.filter(u => u.role === 'super_admin').length;

        // === KOP / HEADER ===
        doc.setFontSize(15);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(185, 28, 28);
        doc.text("DATA AKUN ANGGOTA", 105, 15, { align: "center" });
        doc.setFontSize(10);
        doc.text("Diurutkan Berdasarkan Tingkatan Sabuk", 105, 22, { align: "center" });

        // === INFO SISTEM ===
        doc.setFontSize(9);
        doc.setTextColor(80, 80, 80);
        doc.setFont("helvetica", "normal");
        doc.text("Sistem Informasi Taekwondo Musi Rawas", 105, 28, { align: "center" });
        doc.text(`Tanggal Cetak: ${new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })}`, 105, 33, { align: "center" });

        // === RINGKASAN STATISTIK ===
        doc.setFontSize(9);
        doc.setTextColor(50, 50, 50);
        doc.setFont("helvetica", "bold");
        doc.text(`Total Anggota: ${totalUsers}  |  Atlet: ${totalAtlet}  |  Pelatih: ${totalPelatih}  |  Pengurus: ${totalPengurus}  |  Super Admin: ${totalSuperAdmin}`, 105, 40, { align: "center" });

        // === RINGKASAN PER SABUK ===
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(185, 28, 28);
        doc.text("RINGKASAN PER SABUK", 14, 48);

        const summaryHeaders = [["No", "Tingkatan Sabuk", "Jumlah"]];
        const summaryData = beltSequence
          .filter(b => grouped[b] && grouped[b].length > 0)
          .map((b, i) => [i + 1, b, grouped[b].length]);

        if (noBeltUsers.length > 0) {
          summaryData.push([summaryData.length + 1, 'Tanpa Sabuk (Admin/Pengurus)', noBeltUsers.length]);
        }

        doc.autoTable({
          head: summaryHeaders,
          body: summaryData,
          startY: 51,
          theme: 'grid',
          headStyles: { fillColor: [185, 28, 28], fontSize: 9 },
          styles: { fontSize: 8 },
          columnStyles: {
            0: { halign: 'center', cellWidth: 10 },
            2: { halign: 'center', cellWidth: 20, fontStyle: 'bold' }
          }
        });

        let currentY = doc.lastAutoTable.finalY + 10;

        // === DETAIL PER SABUK ===
        beltSequence.forEach(belt => {
          const members = grouped[belt];
          if (!members || members.length === 0) return;

          if (currentY > 240) { doc.addPage(); currentY = 20; }

          // Judul grup sabuk
          doc.setFontSize(10);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(185, 28, 28);
          doc.text(belt.toUpperCase(), 14, currentY);
          doc.setFontSize(8);
          doc.setTextColor(100, 100, 100);
          doc.text(`${members.length} anggota`, 196, currentY, { align: "right" });
          currentY += 4;

          const headers = [["No", "Nama Lengkap", "Peran", "Dojang", "JK", "No. Reg", "Status"]];
          const data = members.map((m, i) => [
            i + 1,
            m.name,
            m.role === 'super_admin' ? 'Super Admin' : m.role === 'pengurus_club' ? 'Pengurus' : m.role === 'pelatih' ? 'Pelatih' : 'Atlet',
            m.club || '-',
            m.gender === 'Perempuan' ? 'P' : 'L',
            m.regNo || '-',
            m.status === 'Nonaktif' ? 'SUSPENDED' : 'Aktif'
          ]);

          doc.autoTable({
            head: headers,
            body: data,
            startY: currentY,
            theme: 'striped',
            headStyles: { fillColor: [185, 28, 28], fontSize: 8 },
            styles: { fontSize: 7, cellPadding: 1.5 },
            columnStyles: {
              0: { halign: 'center', cellWidth: 8 },
              5: { cellWidth: 28 },
              6: { halign: 'center', cellWidth: 18 }
            },
            didParseCell: function(data) {
              // Highlight SUSPENDED cells
              if (data.section === 'body' && data.column.index === 6 && data.cell.raw === 'SUSPENDED') {
                data.cell.styles.textColor = [220, 38, 38];
                data.cell.styles.fontStyle = 'bold';
              }
            }
          });

          currentY = doc.lastAutoTable.finalY + 8;
        });

        // === KELOMPOK TANPA SABUK (Admin & Pengurus) ===
        if (noBeltUsers.length > 0) {
          if (currentY > 240) { doc.addPage(); currentY = 20; }

          doc.setFontSize(10);
          doc.setFont("helvetica", "bold");
          doc.setTextColor(100, 100, 100);
          doc.text("TANPA SABUK (ADMIN & PENGURUS)", 14, currentY);
          doc.setFontSize(8);
          doc.setTextColor(100, 100, 100);
          doc.text(`${noBeltUsers.length} anggota`, 196, currentY, { align: "right" });
          currentY += 4;

          const headers = [["No", "Nama Lengkap", "Peran", "Dojang", "Email", "Status"]];
          const data = noBeltUsers.map((m, i) => [
            i + 1,
            m.name,
            m.role === 'super_admin' ? 'Super Admin' : 'Pengurus Club',
            m.club || '-',
            m.email || '-',
            m.status === 'Nonaktif' ? 'SUSPENDED' : 'Aktif'
          ]);

          doc.autoTable({
            head: headers,
            body: data,
            startY: currentY,
            theme: 'striped',
            headStyles: { fillColor: [100, 100, 100], fontSize: 8 },
            styles: { fontSize: 7, cellPadding: 1.5 },
            columnStyles: {
              0: { halign: 'center', cellWidth: 8 },
              5: { halign: 'center', cellWidth: 18 }
            },
            didParseCell: function(data) {
              if (data.section === 'body' && data.column.index === 5 && data.cell.raw === 'SUSPENDED') {
                data.cell.styles.textColor = [220, 38, 38];
                data.cell.styles.fontStyle = 'bold';
              }
            }
          });

          currentY = doc.lastAutoTable.finalY + 8;
        }

        // === TANDA TANGAN ===
        if (currentY > 230) { doc.addPage(); currentY = 40; } else { currentY += 10; }

        doc.setFontSize(9);
        doc.setTextColor(120, 120, 120);
        doc.setFont("helvetica", "normal");
        doc.text(`Dicetak dari Sistem Informasi TI Musi Rawas pada ${new Date().toLocaleString('id-ID')}`, 105, currentY, { align: "center" });

        doc.setFontSize(10);
        doc.setTextColor(50, 50, 50);
        doc.setFont("helvetica", "bold");
        doc.text("Mengetahui,", 145, currentY + 14);
        doc.text("Super Admin TI Musi Rawas", 145, currentY + 19);
        doc.setFont("helvetica", "normal");
        doc.text(`(${user.name || 'Super Admin'})`, 145, currentY + 37);

        doc.save(`Data_Akun_Urut_Sabuk_${new Date().toISOString().slice(0,10)}.pdf`);
        triggerToast("PDF Data Akun (Urut Sabuk) berhasil diunduh!");
      };

      // ====================================================================
      // FUNGSI CETAK PDF DAFTAR AKUN PENGGUNA (SESUAI PENCARIAN & FILTER AKTIF)
      // Mencetak visibleUsers: hasil pencarian + filter sabuk yang sedang tampil di layar
      // ====================================================================
      const handleDownloadUserListPDF = () => {
        if (!visibleUsers || visibleUsers.length === 0) { triggerToast("Tidak ada akun untuk dicetak.", "error"); return; }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const roleLabel = { super_admin: 'Super Admin', pengurus_club: 'Pengurus Club', pelatih: 'Pelatih', atlet: 'Atlet' };

        // === KOP ===
        doc.setFontSize(15);
        doc.setFont("helvetica", "bold");
        doc.setTextColor(185, 28, 28);
        doc.text("DATA AKUN PENGGUNA", 105, 15, { align: "center" });
        doc.setFontSize(10);
        doc.text(sabukFilter === 'Semua' ? 'Seluruh Akun Terdaftar' : `Filter Sabuk: ${sabukFilter}`, 105, 22, { align: "center" });
        doc.setFontSize(9);
        doc.setTextColor(80, 80, 80);
        doc.setFont("helvetica", "normal");
        doc.text("Sistem Informasi Taekwondo Musi Rawas", 105, 28, { align: "center" });
        doc.text(`Tanggal Cetak: ${new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })}`, 105, 33, { align: "center" });
        doc.setFontSize(9);
        doc.setTextColor(50, 50, 50);
        doc.setFont("helvetica", "bold");
        const cAtlet = visibleUsers.filter(u => u.role === 'atlet').length;
        const cPelatih = visibleUsers.filter(u => u.role === 'pelatih').length;
        const cPengurus = visibleUsers.filter(u => u.role === 'pengurus_club').length;
        const cAdmin = visibleUsers.filter(u => u.role === 'super_admin').length;
        doc.text(`Total: ${visibleUsers.length} akun  |  Atlet: ${cAtlet}  |  Pelatih: ${cPelatih}  |  Pengurus: ${cPengurus}  |  Super Admin: ${cAdmin}`, 105, 40, { align: "center" });

        // === TABEL DAFTAR AKUN (8 KOLOM DATA: NAMA, USERNAME, TTL, TGL LAHIR, SABUK, NO REG, DOJANG, TGL TERDAFTAR) ===
        const fmtTanggal = (v) => { if (!v) return '-'; const d = new Date(v); return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
        const tglTerdaftar = (u) => {
          if (u.createdAt) return fmtTanggal(u.createdAt);
          if (typeof u.id === 'number' && u.id > 999999999999) return fmtTanggal(u.id);
          return '-';
        };
        const headers = [["No", "Nama Lengkap", "Username", "Tempat Lahir", "Tanggal Lahir", "Sabuk", "No. Reg", "Asal Dojang/Latihan", "Tanggal Terdaftar Akun"]];
        const listData = visibleUsers.map((u, i) => [
          i + 1,
          u.name || '-',
          u.username || '-',
          u.placeOfBirth || '-',
          fmtTanggal(u.dateOfBirth),
          u.sabuk ? u.sabuk.split(' (')[0].replace('Sabuk ', '') : '-',
          u.regNo || '-',
          u.club || '-',
          tglTerdaftar(u)
        ]);

        doc.autoTable({
          head: headers,
          body: listData,
          startY: 46,
          theme: 'striped',
          margin: { left: 8, right: 8 },
          headStyles: { fillColor: [185, 28, 28], fontSize: 7.5 },
          styles: { fontSize: 7, cellPadding: 1.5, overflow: 'linebreak' },
          columnStyles: {
            0: { halign: 'center', cellWidth: 7 },
            1: { cellWidth: 38 },
            2: { cellWidth: 24 },
            3: { cellWidth: 24 },
            4: { halign: 'center', cellWidth: 16 },
            5: { cellWidth: 19 },
            6: { halign: 'center', cellWidth: 15 },
            7: { cellWidth: 27 },
            8: { halign: 'center', cellWidth: 18 }
          },
          didParseCell: function(cellData) {
            if (cellData.section === 'body' && cellData.column.index === 0) {
              cellData.cell.styles.fontStyle = 'bold';
            }
          }
        });

        // === CATATAN PENCARIAN + TANDA TANGAN ===
        let yy = doc.lastAutoTable.finalY + 8;
        if (searchQuery) {
          doc.setFontSize(8);
          doc.setTextColor(120, 120, 120);
          doc.setFont("helvetica", "italic");
          doc.text(`Pencarian aktif: "${searchQuery}"`, 14, yy);
          yy += 6;
        }
        if (yy > 240) { doc.addPage(); yy = 40; } else { yy += 6; }
        doc.setFontSize(9);
        doc.setTextColor(120, 120, 120);
        doc.setFont("helvetica", "normal");
        doc.text(`Dicetak dari Sistem Informasi TI Musi Rawas pada ${new Date().toLocaleString('id-ID')}`, 105, yy, { align: "center" });
        doc.setFontSize(10);
        doc.setTextColor(50, 50, 50);
        doc.setFont("helvetica", "bold");
        doc.text("Mengetahui,", 145, yy + 14);
        doc.text(user.role === 'super_admin' ? "Super Admin TI Musi Rawas" : `Pengurus ${user.club || 'Dojang'}`, 145, yy + 19);
        doc.setFont("helvetica", "normal");
        doc.text(`(${user.name || 'Admin'})`, 145, yy + 37);

        const ftxt = sabukFilter === 'Semua' ? 'Semua' : sabukFilter.replace(/[^A-Za-z0-9]+/g, '-');
        doc.save(`Data_Akun_Pengguna_${ftxt}_${new Date().toISOString().slice(0,10)}.pdf`);
        triggerToast(`PDF Daftar Akun (${visibleUsers.length} akun) berhasil diunduh!`);
      };

      const handleToggleFeature = (roleKey, featureKey, forceValue) => {
        const updated = {
          ...featureSettings,
          [roleKey]: {
            ...featureSettings[roleKey],
            [featureKey]: forceValue !== undefined ? forceValue : !featureSettings[roleKey]?.[featureKey]
          }
        };
        updateFeatureSettings(updated);
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          // Validasi ukuran opsional (maks 2MB agar Base64 tidak memberatkan database)
          if(file.size > 2 * 1024 * 1024) {
             triggerToast("Ukuran logo terlalu besar! Maksimal 2MB.", "error");
             return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            const updatedSettings = {
              ...featureSettings,
              branding: {
                ...(featureSettings.branding || {}),
                logo: reader.result
              }
            };
            updateFeatureSettings(updatedSettings);
            triggerToast("Logo aplikasi berhasil diperbarui di Database!");
          };
          reader.readAsDataURL(file);
        }
      };

      const handleRemoveLogo = () => {
          if(window.confirm("Hapus logo kustom dan kembali ke logo default?")) {
              const updatedSettings = {
                ...featureSettings,
                branding: {
                  ...(featureSettings.branding || {}),
                  logo: null
                }
              };
              updateFeatureSettings(updatedSettings);
              triggerToast("Logo aplikasi dikembalikan ke default!");
          }
      };

      const renderFormInputs = (isEditMode = false) => {
        return (
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-2 bg-white p-2 rounded-xl border">
              <div><label className="block text-[9px] font-bold text-gray-700 uppercase">Username</label><input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full text-xs p-1.5 border-b focus:outline-none" required /></div>
              <div><label className="block text-[9px] font-bold text-gray-700 uppercase">Password</label><input type="text" value={password} onChange={e => setPassword(e.target.value)} className="w-full text-xs p-1.5 border-b focus:outline-none" required /></div>
            </div>
            <div><label className="block text-[10px] font-bold text-gray-700 mb-1">Nama Lengkap</label><input type="text" placeholder="Nama Lengkap" value={name} onChange={e => setName(e.target.value)} className="w-full text-xs p-2.5 border rounded-xl" required /></div>
            <div><label className="block text-[10px] font-bold text-gray-700 mb-1">Email</label><input type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full text-xs p-2.5 border rounded-xl" required /></div>
            
            <div className="grid grid-cols-2 gap-2">
              <div><label className="block text-[10px] font-bold text-gray-700 mb-1">No. Registrasi/Sertifikat</label><input type="text" placeholder="No. Reg (Otomatis jika kosong)" value={regNo} onChange={e => setRegNo(e.target.value)} className="w-full text-xs p-2.5 border rounded-xl" /></div>
              <div><label className="block text-[10px] font-bold text-gray-700 mb-1">Jenis Kelamin</label><select value={gender} onChange={e => setGender(e.target.value)} className="w-full text-xs p-2.5 border rounded-xl"><option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option></select></div>
            </div>
            
            <div className="grid grid-cols-2 gap-2">
              <div><label className="block text-[10px] font-bold text-gray-700 mb-1">Tempat Lahir</label><input type="text" placeholder="Tempat Lahir" value={placeOfBirth} onChange={e => setPlaceOfBirth(e.target.value)} className="w-full text-xs p-2.5 border rounded-xl" required /></div>
              <div><label className="block text-[10px] font-bold text-gray-700 mb-1">Tanggal Lahir</label><input type="date" value={dateOfBirth} onChange={e => setDateOfBirth(e.target.value)} className="w-full text-xs p-2.5 border rounded-xl" required /></div>
            </div>

            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="block text-[10px] font-bold text-gray-700 mb-1">Status Peran Akun</label>
                <select value={role} onChange={e => {setRole(e.target.value); if(e.target.value==='super_admin') setClub('Pusat Mura');}} className="w-full text-xs p-2.5 border rounded-xl bg-yellow-50 border-yellow-300 font-extrabold text-yellow-950">
                  <option value="atlet">Atlet</option>
                  <option value="pelatih">Pelatih</option>
                  {user.role === 'super_admin' && <option value="pengurus_club">Pengurus Club</option>}
                  {user.role === 'super_admin' && <option value="super_admin">Super Admin</option>}
                </select>
              </div>
              <div>
                <label className="block text-[10px] font-bold text-gray-700 mb-1">Unit Latihan / Club</label>
                <select 
                  value={user.role === 'super_admin' ? club : user.club} 
                  onChange={e => setClub(e.target.value)} 
                  className="w-full text-xs p-2.5 border rounded-xl disabled:bg-gray-100 disabled:text-gray-500"
                  disabled={user.role !== 'super_admin'}
                >
                  {user.role === 'super_admin' ? clubs.map(c => <option key={c} value={c}>{c}</option>) : <option value={user.club}>{user.club}</option>}
                </select>
              </div>
            </div>

            {role === 'pelatih' && (
              <div className="animate-fade-in">
                <label className="block text-[10px] font-bold text-red-700 mb-1">Kualifikasi / Lisensi Pelatih</label>
                <input type="text" placeholder="Contoh: Nasional Pratama / Daerah Sumsel" value={license} onChange={e => setLicense(e.target.value)} className="w-full text-xs p-2.5 border border-red-300 bg-red-50 rounded-xl font-bold text-red-950" required />
              </div>
            )}

            {isSabukVisible && (
              <div>
                <label className="block text-[10px] font-bold text-gray-700 mb-1">Tingkatan Sabuk</label>
                <select value={sabuk} onChange={e => setSabuk(e.target.value)} className="w-full text-xs p-2.5 border rounded-xl">
                  {beltSequence.map(b => <option key={b} value={b}>{b}</option>)}
                </select>
              </div>
            )}
          </div>
        );
      };

      return (
        <div className="space-y-4">
          <div className="flex items-center gap-2 border-b pb-2"><Icon name="Users" className="w-5 h-5 text-red-600" /><h2 className="text-lg font-black text-gray-800">Manajemen Akun</h2></div>
          
          <div className="flex bg-gray-200 p-1 rounded-xl">
            <button onClick={() => setManagerTab('pengguna')} className={`flex-1 py-1.5 text-xs rounded-lg font-bold transition-all ${managerTab === 'pengguna' ? 'bg-white text-red-700 shadow-sm' : 'text-gray-500'}`}>Pengguna</button>
            {user.role === 'super_admin' && (
              <>
                <button onClick={() => setManagerTab('club')} className={`flex-1 py-1.5 text-xs rounded-lg font-bold transition-all ${managerTab === 'club' ? 'bg-white text-red-700 shadow-sm' : 'text-gray-500'}`}>Dojang</button>
                <button onClick={() => setManagerTab('sistem')} className={`flex-1 py-1.5 text-xs rounded-lg font-bold transition-all ${managerTab === 'sistem' ? 'bg-white text-red-700 shadow-sm' : 'text-gray-500'}`}>Sistem</button>
              </>
            )}
          </div>

          {managerTab === 'pengguna' && (<div className="space-y-4 animate-fade-in">
            
            {!showAddAccount && !editingUserId && (
              <div className="space-y-2">
                <div className="flex gap-2">
                  <button onClick={() => { handleCancelEdit(); setShowAddAccount(true); }} className="flex-1 bg-red-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-sm flex justify-center items-center"><Icon name="UserPlus" className="w-4 h-4 inline mr-1 text-white"/> Baru</button>

                  <label className="flex-1 bg-emerald-600 hover:bg-emerald-700 cursor-pointer text-white py-2.5 rounded-xl font-bold text-xs shadow-sm flex justify-center items-center gap-1 transition">

                     <input type="file" accept=".csv" className="hidden" onChange={handleFileUpload} />
                  </label>
                </div>
                {/* TOMBOL CETAK PDF AKUN URUT SABUK - KHUSUS SUPER ADMIN */}
                {user.role === 'super_admin' && (
                  <button onClick={handleDownloadAccountsPDF} className="w-full bg-gradient-to-r from-red-700 to-red-800 hover:from-red-800 hover:to-red-900 active:scale-[0.99] text-white py-2.5 rounded-xl font-bold text-xs shadow-sm flex justify-center items-center gap-2 transition">
                    <Icon name="FileText" className="w-4 h-4 text-white" />

                {(user.role === 'super_admin' || user.role === 'pengurus_club') && (
                  <button onClick={handleDownloadUserListPDF} className="w-full bg-blue-700 hover:bg-blue-800 active:scale-[0.99] text-white py-2.5 rounded-xl font-bold text-xs shadow-sm flex justify-center items-center gap-2 transition">
                    <Icon name="Printer" className="w-4 h-4 text-white" />
                    Cetak PDF Daftar Akun{visibleUsers.length > 0 ? ` (${visibleUsers.length} akun)` : ''}
                  </button>
                )}
              </div>

            {/* FORMULIR BUAT AKUN BARU (TETAP DI ATAS JIKA BARU) */}
            {showAddAccount && !editingUserId && (
              <form onSubmit={handleAddAccountSubmit} className="bg-red-50 p-4 rounded-3xl border border-red-100 space-y-3">
                <div className="flex justify-between items-center pb-2 border-b">
                  <span className="font-bold text-xs text-red-950">Akun Baru</span>
                  <button type="button" onClick={handleCancelEdit}><Icon name="XCircle" className="w-5 h-5 text-gray-400" /></button>
                </div>
                {renderFormInputs(false)}
                <button type="submit" className="w-full bg-red-700 hover:bg-red-800 text-white py-2.5 rounded-xl font-bold text-xs shadow mt-2 transition-all">
                  Registrasi Akun Baru
                </button>
              </form>
            )}

            {/* STATISTIK SABUK KESELURUHAN (WRAP / TAMPIL SEMUA LENGKAP) */}
            {activeBelts.length > 0 && !editingUserId && !showAddAccount && (
              <div className="mb-3 animate-fade-in bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                 <div className="flex items-center gap-1.5 mb-2.5">
                   <Icon name="PieChart" className="w-4 h-4 text-red-600" />
                   <span className="text-[10px] font-extrabold text-gray-800 uppercase tracking-wider">Statistik Sabuk Keseluruhan</span>
                 </div>
                 <div className="flex flex-wrap gap-2">
                    {activeBelts.map(belt => (
                       <div key={belt} className="bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 flex items-center gap-2 hover:bg-gray-100 transition cursor-default shadow-sm">
                          <div className={`w-2.5 h-2.5 rounded-full shrink-0 ${getBeltColorDot(belt)}`}></div>
                          <span className="text-[10px] font-bold text-gray-700 leading-none">{belt.split(' (')[0].replace('Sabuk ', '')}</span>
                          <span className="text-[10px] font-black text-white bg-red-600 px-1.5 py-0.5 rounded leading-none flex items-center justify-center">{beltStats[belt]}</span>
                       </div>

              </div>

              </div>

                <select value={sabukFilter} onChange={e => setSabukFilter(e.target.value)} className="w-full text-xs pl-9 p-2.5 pr-2 bg-white border border-gray-200 rounded-xl focus:ring-1 focus:ring-red-500 transition appearance-none cursor-pointer">
